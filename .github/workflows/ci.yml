name: CI

# Three-platform build verification plus the automated test suites:
#
#   build-test  builds, runs the C++ unit tests and then drives the real
#               binary with the pytest suite on Linux, macOS and Windows.
#
# The e2e steps live in the same job, after the build and unit tests, so they
# only start once those have passed — on every platform.
#
# The heavy third-party dependencies (compat.openssl, compat.ftxui, ...) are
# compiled once and cached under ~/.mcpp by the shared setup-mcpp action.
#
# MCPP_VERSION pins the mcpp release installed by setup-mcpp; bump it by hand.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCPP_VERSION: "2026.10.1.3"

jobs:
  build-test:
    name: Build, unit & e2e tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcpp

      - name: Build — accel library
        shell: bash
        run: '"$MCPP" build -p libs/accel'

      - name: Build — application
        shell: bash
        run: '"$MCPP" build -p apps/ghacc'

      - name: Unit tests — accel library
        shell: bash
        run: '"$MCPP" test -p libs/accel'

      - name: Unit tests — application
        shell: bash
        run: '"$MCPP" test -p apps/ghacc'

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find target -type f \( -name ghacc -o -name ghacc.exe \) -path '*/bin/*' | sort | head -1)"
          test -n "$BIN"
          echo "binary: $BIN"
          "$BIN" version
          "$BIN" help >/dev/null
          "$BIN" status --json --dir "$RUNNER_TEMP/ghacc-ca" >/dev/null

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Run the pytest suite
        shell: bash
        working-directory: tests/e2e
        run: |
          set -euo pipefail
          BIN="$(find ../../target -type f \( -name ghacc -o -name ghacc.exe \) -path '*/bin/*' | sort | head -1)"
          test -n "$BIN"
          BIN="$(realpath "$BIN")"
          # Windows needs a native path for the Python interpreter.
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$(cygpath -w "$BIN")"
          fi
          echo "GHACC_BIN=$BIN"
          GHACC_BIN="$BIN" uv run pytest -q
