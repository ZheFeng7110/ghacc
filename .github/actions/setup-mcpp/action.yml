name: Setup mcpp
description: >-
  Install the released mcpp (via xlings), point it at the GLOBAL mirror and
  export the resolved binary as $MCPP.

inputs:
  xlings-version:
    description: Pinned xlings version used to bootstrap the package manager.
    required: false
    default: v2026.9.30.1

runs:
  using: composite

  steps:
    - name: Install xlings (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        XLINGS_NON_INTERACTIVE: '1'
      run: |
        set -euo pipefail
        curl -fsSL \
          https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh \
          | bash -s ${{ inputs.xlings-version }}
        echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

    - name: Install xlings (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        XLINGS_NON_INTERACTIVE: '1'
      run: |
        $ErrorActionPreference = 'Stop'
        irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
        "$env:USERPROFILE\.xlings\subos\current\bin" |
          Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    - name: Install mcpp and configure the GLOBAL mirror
      shell: bash
      env:
        XLINGS_NON_INTERACTIVE: '1'
      run: |
        set -euo pipefail
        export PATH="$HOME/.xlings/subos/current/bin:$PATH"

        # Keep the package index current, then install the released client.
        xlings update || true
        xlings install mcpp -y

        # Resolve the real mcpp binary. On POSIX the shim on PATH is an
        # executable symlink; on Windows it may only exist as `mcpp.exe`, so
        # fall back to searching the payload directories.
        MCPP="$(command -v mcpp || true)"
        if [ -z "${MCPP}" ] || [ ! -x "${MCPP}" ]; then
          MCPP="$(find "$HOME/.xlings/data/xpkgs" "$HOME/.mcpp/registry/data/xpkgs" \
                    -type f \( -name mcpp -o -name mcpp.exe \) 2>/dev/null \
                  | sort -V | tail -1)"
        fi
        test -n "${MCPP}"
        test -x "${MCPP}"

        # GitHub-hosted runners are outside CN: fetch dependencies from the
        # global (GitHub) mirror.
        "${MCPP}" self config --mirror GLOBAL
        "${MCPP}" --version

        echo "MCPP=${MCPP}" >> "$GITHUB_ENV"

    # mcpp keeps toolchains and built dependencies under ~/.mcpp; restoring it
    # turns the first (slow) OpenSSL/FTXUI build into a cache hit.
    - name: Cache mcpp payloads
      uses: actions/cache@v4
      with:
        path: ~/.mcpp
        key: mcpp-${{ runner.os }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', 'libs/accel/mcpp.toml', 'apps/ghacc/mcpp.toml') }}
        restore-keys: |
          mcpp-${{ runner.os }}-
