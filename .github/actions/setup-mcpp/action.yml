name: Setup mcpp
description: >-
  Install the pinned mcpp release directly from GitHub Releases (sha256
  verified) and point it at the GLOBAL mirror. The calling workflow declares
  `MCPP_VERSION`; the resolved binary is exported as $MCPP.

runs:
  using: composite

  steps:
    # mcpp keeps toolchains and built dependencies under ~/.mcpp; restoring it
    # turns the first (slow) OpenSSL/FTXUI build into a cache hit. Restored
    # before the install so a cached payload never shadows the pinned release.
    - name: Cache mcpp payloads
      uses: actions/cache@v6
      with:
        path: ~/.mcpp
        key: mcpp-${{ runner.os }}-v${{ env.MCPP_VERSION }}-${{ hashFiles('mcpp.toml', 'mcpp.lock', 'libs/accel/mcpp.toml', 'apps/ghacc/mcpp.toml') }}
        restore-keys: |
          mcpp-${{ runner.os }}-v${{ env.MCPP_VERSION }}-

    - name: Install mcpp
      shell: bash
      run: |
        set -euo pipefail
        VER="${{ env.MCPP_VERSION }}"
        case "$RUNNER_OS" in
          Linux)   PLAT="linux-x86_64";   EXT="tar.gz" ;;
          macOS)   PLAT="macosx-arm64";   EXT="tar.gz" ;;
          Windows) PLAT="windows-x86_64"; EXT="zip"    ;;
          *) echo "unsupported runner os: $RUNNER_OS"; exit 1 ;;
        esac
        BASE="https://github.com/mcpp-community/mcpp/releases/download/v${VER}"

        WORK=$(mktemp -d)
        curl -fsSL -o "$WORK/mcpp.$EXT"        "$BASE/mcpp-${VER}-${PLAT}.${EXT}"
        curl -fsSL -o "$WORK/mcpp.$EXT.sha256" "$BASE/mcpp-${VER}-${PLAT}.${EXT}.sha256"
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$WORK/mcpp.$EXT" | awk '{print $1}')
        else
          actual=$(shasum -a 256 "$WORK/mcpp.$EXT" | awk '{print $1}')
        fi
        expected=$(awk '{print $1}' "$WORK/mcpp.$EXT.sha256")
        test "$actual" = "$expected" || { echo "sha256 mismatch"; exit 1; }
        echo "mcpp ${VER} ${PLAT} sha256 verified"

        mkdir -p "$HOME/.mcpp"
        case "$EXT" in
          tar.gz) tar -xzf "$WORK/mcpp.$EXT" -C "$HOME/.mcpp" --strip-components=1 ;;
          zip)
            unzip -q "$WORK/mcpp.$EXT" -d "$WORK/zip"
            # The zip has a single wrapper directory (mcpp-<ver>-<plat>/...).
            cp -R "$WORK/zip"/*/* "$HOME/.mcpp/"
            ;;
        esac
        rm -rf "$WORK"

        echo "$HOME/.mcpp/bin" >> "$GITHUB_PATH"

        # GitHub-hosted runners are outside CN: fetch dependencies from the
        # global (GitHub) mirror.
        "$HOME/.mcpp/bin/mcpp" self config --mirror GLOBAL
        "$HOME/.mcpp/bin/mcpp" --version

        echo "MCPP=$HOME/.mcpp/bin/mcpp" >> "$GITHUB_ENV"
